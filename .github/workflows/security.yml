name: Security Scans

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: "30 1 * * 0" # Run weekly on Sundays at 1:30 AM

jobs:
  secret-scanning:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches to find secrets in history

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        if: github.event_name == 'pull_request'

      - name: TruffleHog OSS (Push)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --debug --only-verified
        if: github.event_name == 'push'

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          # queries: ./path/to/local/query, your-org/your-repo/queries@main

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
      - name: "Dependency Review"
        uses: actions/dependency-review-action@v4
        with:
          # Possible values: "critical", "high", "moderate", "low"
          fail-on-severity: high

  package-audit:
    name: Package-Level Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Surface Package Vulnerabilities by Name
        run: |
          npm audit --json > audit.json || true
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('audit.json')) process.exit(0);
            const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const vulns = report.vulnerabilities || {};
            console.log('--- PACKAGE VULNERABILITY REPORT ---');
            for (const [pkgName, detail] of Object.entries(vulns)) {
              console.log(\`[ADVISORY] Package: \${pkgName} | Severity: \${detail.severity} | Via: \${JSON.stringify(detail.via)}\`);
            }
            if (vulns['formidable']) {
              console.error('[ALERT] Vulnerability detected in file upload parsing dependency: formidable');
              process.exit(1);
            }
            console.log('File upload dependency (formidable) verified clean and uncompromised.');
          "
